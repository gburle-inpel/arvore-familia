<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Família — Burle + Albuquerque Maranhão</title>
<style>
:root{
  --paper:#f4eee2; --paper2:#efe7d6; --ink:#2e2a24; --soft:#8a8170;
  --line:#d9cdb4; --card:#fffdf8; --shadow:0 1px 2px #00000010,0 4px 14px #6b573514;
  --m1:#2f6f86; --m2:#e7f0f3; --f1:#a83c64; --f2:#f6e8ee; --gold:#9c7b3f; --accent:#6b3b2e;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 600px at 70% -10%, #fbf7ee, var(--paper));}
/* header */
header{position:sticky;top:0;z-index:20;background:linear-gradient(#fffdf9,#f7f0e2);
  border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  box-shadow:0 2px 10px #6b573512}
.brand{display:flex;flex-direction:column;line-height:1.05}
.brand b{font-family:Georgia,"Times New Roman",serif;font-size:21px;letter-spacing:.3px;color:var(--accent)}
.brand small{color:var(--soft);font-size:12px;margin-top:2px}
.spacer{flex:1}
.search{position:relative}
.search input{width:300px;max-width:46vw;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:999px;
  font-size:14px;background:#fff;outline:none;transition:.15s;box-shadow:inset 0 1px 2px #0000000a}
.search input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #9c7b3f22}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--soft)}
.btn{padding:8px 13px;border:1px solid var(--line);background:#fff;border-radius:999px;cursor:pointer;font-size:13px;
  color:#5b5346;transition:.15s}
.btn:hover{background:var(--paper2);border-color:var(--gold);color:var(--accent)}
/* layout */
#wrap{display:flex;height:calc(100vh - 58px)}
#tree{flex:1;overflow:auto;padding:22px 26px 80px}
/* árvore + conectores */
.tree, .tree ul{list-style:none}
.tree{margin:0;padding:0}
.tree ul{margin:0;padding-left:30px;position:relative}
.tree li{position:relative;padding:4px 0}
.tree ul>li::before{content:"";position:absolute;left:-16px;top:-4px;bottom:0;border-left:2px solid var(--line)}
.tree ul>li::after{content:"";position:absolute;left:-16px;top:21px;width:16px;border-top:2px solid var(--line)}
.tree ul>li:last-child::before{height:25px;bottom:auto}
.row{display:inline-flex;align-items:center;gap:8px}
.tog{width:22px;height:22px;flex:0 0 22px;border:1px solid var(--line);background:#fff;border-radius:50%;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--soft);font-size:12px;
  transition:.15s;box-shadow:0 1px 1px #0000000d}
.tog:hover{border-color:var(--gold);color:var(--accent);background:var(--paper2)}
.tog.leaf{visibility:hidden}
/* chip de pessoa */
.chip{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border:1px solid var(--line);
  background:var(--card);border-radius:999px;cursor:pointer;box-shadow:var(--shadow);transition:.13s;max-width:min(82vw,520px)}
.chip:hover{transform:translateY(-1px);border-color:var(--gold);box-shadow:0 2px 4px #00000012,0 8px 20px #6b573522}
.ava{width:26px;height:26px;flex:0 0 26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;letter-spacing:.2px}
.ava.m{background:linear-gradient(135deg,#3a7d94,#2f6f86)} .ava.f{background:linear-gradient(135deg,#c1577c,#a83c64)}
.who{display:flex;flex-direction:column;line-height:1.12;min-width:0}
.nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm.m{color:#205b70} .nm.f{color:#8f2f52}
.dt{font-size:11px;color:var(--soft)}
.chip.spouse{background:var(--paper2);box-shadow:none;border-style:dashed;opacity:.95}
.chip.spouse .ava{opacity:.85;transform:scale(.92)} .chip.spouse .nm{font-weight:500}
.amp{color:var(--gold);font-size:13px;margin:0 -2px}
.kcount{font-size:11px;color:#fff;background:#bcae90;border-radius:999px;padding:1px 8px;font-weight:600}
.rep{color:#c9bfa8;font-size:12px}
.hit .chip{outline:3px solid #f3c34d;outline-offset:1px;background:#fff9e8}
.collapsed>.row .tog{} .collapsed>ul{display:none}
/* painel */
#panel{position:fixed;top:56px;right:0;bottom:0;width:340px;max-width:90vw;border-left:1px solid var(--line);
  background:linear-gradient(#fffdf9,#f8f1e4);overflow:auto;transform:translateX(106%);transition:.24s;
  z-index:40;box-shadow:-8px 0 26px #6b573522}
#panel.show{transform:none}
.pk{position:absolute;top:10px;right:12px;cursor:pointer;color:var(--soft);font-size:18px;border:0;background:none}
.phead{padding:22px 20px 16px;text-align:center;border-bottom:1px solid var(--line)}
.phead .big{width:62px;height:62px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:700;color:#fff}
.phead h2{margin:0;font-size:18px;font-family:Georgia,serif;color:var(--accent)}
.pbody{padding:8px 20px 30px}
.pk2{color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin:16px 0 3px;font-weight:700}
.pv{font-size:14px}
.pv a,.px{color:var(--m1);cursor:pointer} .px:hover{text-decoration:underline}
.muted{color:#b4a98f}
.note{font-size:12px;color:#7a7160;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;line-height:1.4}
.legend{padding:0 26px 6px;color:var(--soft);font-size:12px}
.legend b.m{color:#205b70}.legend b.f{color:#8f2f52}
::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-thumb{background:#d8ccb2;border-radius:9px;border:3px solid var(--paper)}
@media (max-width:760px){
 header{padding:9px 12px;gap:8px}
 .brand b{font-size:16px} .brand small{display:none}
 .search{order:3;flex:1 1 100%} .search input{width:100%;max-width:none}
 .btn{padding:7px 9px;font-size:12px}
 #wrap{height:auto;display:block}
 #tree{padding:12px 10px 90px;overflow:visible}
 .tree ul{padding-left:18px} .tree ul>li::before{left:-14px} .tree ul>li::after{left:-14px;width:14px}
 .chip{max-width:78vw} .nm{font-size:13px}
 #panel{top:auto;left:0;right:0;bottom:0;width:100%;max-width:none;height:80vh;
  border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;
  transform:translateY(106%);box-shadow:0 -10px 30px #6b573540}
 #panel.show{transform:none}
 .pk{font-size:26px;top:8px;right:16px}
 .legend{padding:0 12px 6px;font-size:11px}
}
</style></head><body>

  document.getElementById('stat').textContent=`${ids.length} pessoas · paterna (Burle-Dubeux) + materna (Albuquerque Maranhão)`;
  document.querySelectorAll('.tog:not(.leaf)').forEach(t=>t.onclick=e=>{e.stopPropagation();
    const li=t.closest('li'); li.classList.toggle('collapsed'); t.textContent=li.classList.contains('collapsed')?'▸':'▾';});
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>showPerson(+c.dataset.id));
  collapseBeyond(0);  // inicia tudo recolhido: só os nomes dos troncos no topo
}
function collapseBeyond(md){document.querySelectorAll('.tree > li').forEach(li=>setDepth(li,0,md));}
function setDepth(li,d,md){const t=li.querySelector(':scope > .row > .tog');
  if(t&&!t.classList.contains('leaf')){if(d>=md){li.classList.add('collapsed');t.textContent='▸';}else{li.classList.remove('collapsed');t.textContent='▾';}}
  li.querySelectorAll(':scope > ul > li').forEach(c=>setDepth(c,d+1,md));}
function expandAll(o){document.querySelectorAll('.tree li.br').forEach(li=>{const t=li.querySelector(':scope > .row > .tog');
  if(o){li.classList.remove('collapsed');if(t)t.textContent='▾';}else{li.classList.add('collapsed');if(t)t.textContent='▸';}});}

function showPerson(i){const p=P[i];const sx=p.s.toLowerCase();
  const dl=(d,pl)=> (d||pl)?`${esc(d||'?')}${pl?' · '+esc(pl):''}`:'<span class="muted">—</span>';
  const lk=id=>P[id]?`<span class="px" onclick="showPerson(${id})">${esc(P[id].n)}</span>`:'';
  const pais=(p.pa||[]).filter(x=>P[x]).map(lk).join(', ')||'<span class="muted">—</span>';
  const conj=(p.sp||[]).filter(x=>P[x]).map(lk).join(', ')||'<span class="muted">—</span>';
  const fl=(kids[i]||[]).map(lk).join(', ')||'<span class="muted">—</span>';
  document.getElementById('pcontent').innerHTML=
   `<div class="phead"><div class="big ava ${sx}" style="font-size:22px">${esc(ini(p.n))}</div><h2>${esc(p.n)}</h2></div>`+
   `<div class="pbody">`+
   `<div class="pk2">Nascimento</div><div class="pv">${dl(p.b,p.bp)}</div>`+
   `<div class="pk2">Falecimento</div><div class="pv">${dl(p.d,p.dp)}</div>`+
   (p.o?`<div class="pk2">Profissão</div><div class="pv">${esc(p.o)}</div>`:'')+
   `<div class="pk2">Pais</div><div class="pv">${pais}</div>`+
   `<div class="pk2">Cônjuge(s)</div><div class="pv">${conj}</div>`+
   `<div class="pk2">Filhos (${(kids[i]||[]).length})</div><div class="pv">${fl}</div>`+
   (p.note?`<div class="pk2">Verbete</div><div class="note">${esc(p.note)}</div>`:'')+
   `<div class="pk2">Fonte</div><div class="pv"><a href="https://www.parentesco.com.br/index.php?apg=pessoa&idp=${i}" target="_blank">parentesco.com.br #${i} ↗</a></div>`+
   `</div>`;
  document.getElementById('panel').classList.add('show');
  document.getElementById('wrap').classList.add('haspanel');
}
function closePanel(){document.getElementById('panel').classList.remove('show');document.getElementById('wrap').classList.remove('haspanel');}

let qt;
document.getElementById('q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>doSearch(e.target.value.trim()),180);});
function norm(s){return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();}
function doSearch(q){
  document.querySelectorAll('.hit').forEach(x=>x.classList.remove('hit'));
  if(!q){collapseBeyond(0);return;}
  const nq=norm(q);let first=null;
  document.querySelectorAll('.nm').forEach(n=>{
    if(norm(n.textContent).includes(nq)){const li0=n.closest('li');li0.classList.add('hit');
      let li=li0; while(li){li.classList.remove('collapsed');const t=li.querySelector(':scope > .row > .tog');if(t&&!t.classList.contains('leaf'))t.textContent='▾';li=li.parentElement.closest('li');}
      if(!first)first=n;}});
  if(first)first.scrollIntoView({block:'center',behavior:'smooth'});
}
build();
</script></body></html>
